name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build (Ubuntu / system Qt6)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Show build output
        run: ls -la build && file build/Mpeg4Player

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pipx install clang-format==23.1.0

      # Deliberately NON-BLOCKING for now. Adopting clang-format on
      # hand-formatted code is a one-time reformat of roughly a quarter to a
      # half of all lines (measured per repo -- see STANDARD.md). Until that
      # normalisation commit lands, this job reports drift without failing CI.
      #
      # To make it a hard gate, delete the `continue-on-error` line below.
      - name: Check formatting
        continue-on-error: true
        run: |
          clang-format --version
          find . -type d \( -name build -o -name 'build-*' -o -name .git                              -o -name '*_autogen' -o -name _deps \) -prune -o                -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) -print0             | xargs -0 -r clang-format --dry-run --Werror
